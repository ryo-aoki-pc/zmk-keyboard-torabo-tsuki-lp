# This file generates the GitHub Actions matrix.
#
# ブートローダへの切り替え (CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER) には zephyr,cdc-acm-uart ノードが
# 必要で、それを定義しているのは studio-rpc-usb-uart スニペットだけなので、Studio 版以外にも付ける。
# スニペット自体は Studio を有効にしない。Studio 版は cmake-args の -DCONFIG_ZMK_STUDIO=y で作る。
---
include:
# Central = Right (右手側にトラックボール)
  - board: bmp_boost
    shield: torabo_tsuki_lp_left
    snippet: studio-rpc-usb-uart
    artifact-name: torabo_tsuki_lp_left_peripheral
  - board: bmp_boost
    shield: torabo_tsuki_lp_right
    snippet: "studio-rpc-usb-uart input-trackball input-listener"
    artifact-name: torabo_tsuki_lp_right_central
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  - board: bmp_boost
    shield: torabo_tsuki_lp_right
    snippet: "studio-rpc-usb-uart input-trackball input-listener"
    artifact-name: torabo_tsuki_lp_right_central_studio
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  # ログ版 (USB の COM ポートにデバッグログを出す。Studio は入らない)。zmk-config-keyboards の
  # tools/keyboard-check.cmd の「レイヤーの動きを見る」で、押したキーのレイヤーの遷移と解決を表示するのに使う。
  # ボールを動かすと入力プロセッサのログが増えるので、ログのバッファを大きくする。
  # ログを出すとスレッドのスタックの使用量も増え、ZMK の既定のサイズでは溢れるおそれがある (KUKEY42 では
  # BLE 接続中に数秒で止まった。セントラルの入力スレッドは Zephyr の既定の 512 バイトのまま)。ログ版だけ、
  # ZMK のコードが動くスレッドのスタックを 2048 (システムのワークキューと BT の受信スレッドは 3072) にし、
  # thread analyzer でスレッドごとのスタックの最大使用量を 30 秒ごとにログに出す (<inf> thread_analyzer: の行)。
  # ログ版の cmake-args は、zmk-config-keyboards の ZMK の 6 リポジトリで揃える
  - board: bmp_boost
    shield: torabo_tsuki_lp_right
    artifact-name: torabo_tsuki_lp_right_central_logging
    snippet: "studio-rpc-usb-uart zmk-usb-logging input-trackball input-listener"
    cmake-args: >-
      -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
      -DCONFIG_LOG_BUFFER_SIZE=32768
      -DCONFIG_INPUT_THREAD_STACK_SIZE=2048
      -DCONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
      -DCONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
      -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048
      -DCONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
      -DCONFIG_MAIN_STACK_SIZE=2048
      -DCONFIG_USB_WORKQUEUE_STACK_SIZE=2048
      -DCONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
      -DCONFIG_BT_RX_STACK_SIZE=3072
      -DCONFIG_THREAD_NAME=y
      -DCONFIG_THREAD_ANALYZER=y
      -DCONFIG_THREAD_ANALYZER_USE_LOG=y
      -DCONFIG_THREAD_ANALYZER_AUTO=y
      -DCONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30

